<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Registro de Clientes</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #0f172a; color: #f8fafc; margin: 0; }
    .tarjeta { background: #1e293b; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 320px; }
    h2 { text-align: center; color: #38bdf8; margin-top: 0; }
    .campo { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: bold; font-size: 0.9rem; }
    input, select { width: 100%; padding: 0.5rem; border: 1px solid #475569; background: #0f172a; color: white; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 0.7rem; background-color: #0ea5e9; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; }
    button:hover { background-color: #0284c7; }
    #mensaje { margin-top: 1rem; text-align: center; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="tarjeta">
    <h2>TechStore</h2>
    <form id="formularioRegistro">
      <div class="campo">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" required>
      </div>
      <div class="campo">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required>
      </div>
      <div class="campo">
        <label for="interes">Producto de Interés</label>
        <select id="interes" required>
          <option value="">Seleccione una opción</option>
          <option value="Laptops Gamer">Laptops Gamer</option>
          <option value="Tarjetas Gráficas">Tarjetas Gráficas</option>
          <option value="Procesadores">Procesadores</option>
          <option value="Accesorios">Accesorios</option>
        </select>
      </div>
      <button type="submit">Registrarse</button>
    </form>
    <div id="mensaje"></div>
  </div>
  <script src="ClienteRegistro.js"></script>
  <script src="app.js"></script>
</body>
</html>
